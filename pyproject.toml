[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quaccatoo"
dynamic = ["version"]
description = "Quantum Color Centers Analysis Toolbox"
readme = "README.md"

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

requires-python = ">=3.10"

authors = [
    { name = "Lucas Tsunaki", email = "tsunakilucas@gmail.com" },
    { name = "Anmol Singh"},
    { name = "Sergei Trofimov", email = "sergei.trofimov@helmholtz-berlin.de" },
    { name = "Kseniia Volkova", email = "kseniia.volkova@helmholtz-berlin.de" },
    { name = "Boris Naydenov", email = "boris.naydenov@helmholtz-berlin.de" }
]

maintainers = [
    { name = "Lucas Tsunaki", email = "tsunakilucas@gmail.com" },
    { name = "Anmol Singh", email = "anmol.singh@helmholtz-berlin.de" },
]

dependencies = [
    "lmfit",
    "matplotlib",
    "numpy",
    "qutip>=5",
    "scipy",
    "dill",
]

classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]

[project.urls]
Homepage = "https://github.com/QISS-HZB/QuaCCAToo"
Source = "https://github.com/QISS-HZB/QuaCCAToo"
Documentation = "https://qiss-hzb.github.io/QuaCCAToo/"
Issues = "https://github.com/QISS-HZB/QuaCCAToo/issues"
PyPI = "https://pypi.org/project/quaccatoo/"
arXiv = "https://arxiv.org/abs/2507.18759"

[tool.hatch.version]
path = "quaccatoo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = [
    "./quaccatoo",
]

[tool.hatch.build.targets.sdist]
include = [
    "quaccatoo",
    "tests",
]
exclude =[
    "docs"
]

[project.optional-dependencies]
dev = [
    "hatch",
    "pytest",
    "ruff",
    "ty",
    "pylint"
]

[tool.hatch.envs.dev]
features = [
    "dev",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# E4/E7/E9 and F are the defaults of ruff, the rest are:
# I    import sorting
# W    pycodestyle warnings
# SIM  simplifiable code
# C4   comprehensions
# NPY  numpy specific rules
# B    likely bugs, such as mutable default arguments or warnings without stacklevel
# PT   pytest style
# ARG  unused arguments
select = ["E4", "E7", "E9", "F", "I", "W", "SIM", "C4", "NPY", "B", "PT", "ARG"]
ignore = ["E741"]
task-tags = [""]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.coverage.report]
skip_empty = true

[tool.ty.src]
exclude = ["tests/", "docs/"]

[tool.pylint.design]
# set to the current maxima in the package, so that growing any of them is a conscious decision:
# args/positional  fit_functions.fit_five_sinc2 (17)
# locals           predef_dd_seqs.XY8.__init__ (23)
# branches         pulsed_sim.PulsedSim._check_attr_predef_seqs (36)
# statements       pulsed_sim.PulsedSim._check_attr_predef_seqs (78)
# attributes       pulsed_sim.PulsedSim (23)
max-args = 17
max-positional-arguments = 17
max-locals = 23
max-branches = 36
max-statements = 78
max-attributes = 23

[tool.pylint."messages control"]
disable = [
    "R1720", "R1705", # if-else statements
    "C0103", "C0301", # long line, case variables
    "W0511", # todo comments
    "W0221", "W0223", # overriding of parameters in parent class
    "W0201" # lazy init
    ]

[tool.pylint.similarities]
ignore-imports = true
ignore-comments = true
ignore-docstrings = true
min-similarity-lines = 9
